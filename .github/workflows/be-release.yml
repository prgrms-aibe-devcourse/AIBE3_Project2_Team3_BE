name: be-release

on:
  push:
    tags:
      - "be-v*.*.*"

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pi-backend
      IMAGE_TAG: ${{ github.ref_name }}            # 예: be-v1.2.3
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/pi-backend:${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Gradle JVM 24)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Make gradlew executable (Linux)
        run: chmod +x ./gradlew

      # ✅ 루트에서 빌드 (모노레포가 아니므로 working-directory 제거)
      - name: Build JAR
        run: ./gradlew clean build -x test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ✅ 루트의 Dockerfile 사용 (모노레포가 아니면 file: Dockerfile)
      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE_REF }}
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SBOM (단일 태그로 명시)
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_REF }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      # 취약점 스캔 (단일 태그로 명시)
      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: "0"     # 실패로 막고 싶으면 "1"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
