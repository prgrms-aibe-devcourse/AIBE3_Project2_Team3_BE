name: Build & Push to ECR

on:
  push:
    branches: [ "main" ]   # IAM 신뢰정책 sub와 일치해야 함

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "109936653790"
  ECR_REPOSITORY: "jobpick-backend"
  IMAGE_TAG: "${{ github.sha }}"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 소스 체크아웃
      - uses: actions/checkout@v4

      # 2️⃣ JDK 25 설정 (Gradle 빌드용)
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # 3️⃣ Gradle 빌드 (Dockerfile이 단일 스테이지일 경우 필요)
      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Gradle Build Jar
        run: ./gradlew --no-daemon clean bootJar

      # 4️⃣ AWS OIDC 인증
      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::109936653790:role/GitHubActionsECRAccessRole
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # 5️⃣ ECR 로그인
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 6️⃣ 레포지토리 이름 정규화
      - name: Normalize repository name
        run: |
          REPO="${ECR_REPOSITORY,,}"         # 소문자 변환
          REPO="${REPO//_/-}"                # 언더스코어 → 하이픈
          echo "ECR_REPO_NORM=$REPO" >> $GITHUB_ENV

      # 7️⃣ 리포지토리 존재 확인 (없으면 생성)
      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "$ECR_REPO_NORM" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$ECR_REPO_NORM" >/dev/null

      # 8️⃣ Docker Build & Push
      - name: Build & Push Docker image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "Building Docker image for commit ${{ env.IMAGE_TAG }}"
          docker build -t $REGISTRY/$ECR_REPO_NORM:${{ env.IMAGE_TAG }} .
          docker push $REGISTRY/$ECR_REPO_NORM:${{ env.IMAGE_TAG }}