name: Build & Push to ECR

on:
  push:
    branches: [ "main" ]   # 신뢰정책 sub와 일치해야 함

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ACCOUNT_ID: "109936653790"
  ECR_REPOSITORY: "jobpick-backend"
  IMAGE_TAG: "${{ github.sha }}"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::109936653790:role/GitHubActionsECRAccessRole
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ⬇️ 옵션 B 핵심: 리포 이름을 소문자(+ 언더스코어→하이픈)로 정규화
      - name: Normalize repository name
        run: |
          REPO="${ECR_REPOSITORY,,}"         # 소문자
          REPO="${REPO//_/-}"                # _ 를 - 로 교체(필요 시)
          echo "ECR_REPO_NORM=$REPO" >> $GITHUB_ENV

      # 없으면 생성(처음 한 번만 실행될 수 있음)
      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "$ECR_REPO_NORM" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$ECR_REPO_NORM" >/dev/null

      - name: Build & Push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_REPO_NORM:${{ env.IMAGE_TAG }} .
          docker push $REGISTRY/$ECR_REPO_NORM:${{ env.IMAGE_TAG }}
          docker tag  $REGISTRY/$ECR_REPO_NORM:${{ env.IMAGE_TAG }} $REGISTRY/$ECR_REPO_NORM:latest
          docker push $REGISTRY/$ECR_REPO_NORM:latest