name: be-ci

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/be-ci.yml"
  push:
    branches: ["dev", "feat/**"] # 원하면 조정

jobs:
  ci:
    runs-on: ubuntu-latest

    # (옵션) S3 통합테스트용 LocalStack를 띄우고 싶다면 주석 해제
    # services:
    #   localstack:
    #     image: localstack/localstack:latest
    #     ports:
    #       - 4566:4566  # 모든 AWS 서비스 엔드포인트
    #     env:
    #       SERVICES: s3
    #       DEBUG: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle 구동 JVM은 24로! (Gradle 8.14.x와 호환)
      - name: Setup Java (Gradle JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: gradle  # Gradle 캐시 활성화

      # (강력 추천) gradle-build-action: 로컬 빌드캐시/종속성 캐시 최적화
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      # (선택) 환경 변수: 테스트 프로필, JPA DDL, LocalStack S3 엔드포인트 등
      - name: Set BE env
        run: |
          echo "SPRING_PROFILES_ACTIVE=test" >> $GITHUB_ENV
          # LocalStack를 쓴다면:
          # echo "S3_ENDPOINT=http://localhost:4566" >> $GITHUB_ENV

      # 정적 포맷/린트 (사용 중이면 활성화)
      - name: Spotless check (format)
        working-directory: backend
        run: ./gradlew spotlessCheck

      - name: Run unit tests (JUnit5)
        working-directory: backend
        run: ./gradlew test --info

      # 테스트 리포트/커버리지 업로드(있다면). jacocoReport는 빌드스크립트에서 활성화되어 있어야 함
      - name: Generate JaCoCo report
        if: success()
        working-directory: backend
        run: ./gradlew jacocoTestReport

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: backend/build/test-results/test

      - name: Upload coverage report (JaCoCo HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/build/reports/jacoco/test/html

      # QueryDSL은 보통 annotationProcessor로 빌드 시 생성됩니다.
      # 별도 단계 없이 build에 포함되므로 아래 build에서 생성/검증됩니다.
      - name: Build (compile + QueryDSL gen)
        working-directory: backend
        run: ./gradlew build -x test

      # (선택) 보안 점검: SBOM, 취약점 스캔 등은 릴리스 워크플로우에 넣는 걸 권장