name: be-ci

on:
  pull_request:
    paths:
      - "**"                         # 루트 변경도 감지
      - ".github/workflows/be-ci.yml"
  push:
    branches: ["dev", "feature/**"]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle JVM은 24 (Gradle 8.14.x와 호환) / 코드 toolchain은 25 (build.gradle.kts에서 설정)
      - name: Setup Java (Gradle JVM)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Make gradlew executable (Linux)
        run: chmod +x ./gradlew

      # 테스트 프로필 등 환경 변수
      - name: Set BE env
        run: echo "SPRING_PROFILES_ACTIVE=test" >> $GITHUB_ENV

#      - name: Run unit tests (JUnit5)
#        run: ./gradlew test --info

      # JaCoCo 플러그인 사용 중일 때만 유지 (없으면 이 스텝 삭제)
      - name: Generate JaCoCo report
        if: success()
        run: ./gradlew jacocoTestReport

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: build/test-results/test

      - name: Upload coverage report (JaCoCo HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/html

      # QueryDSL은 annotationProcessor로 자동 생성됨 (빌드에 포함)
      - name: Build (compile + QueryDSL gen)
        run: ./gradlew build -x test
